{% comment %}
Ícones SVG inline. Traço de 1.6 para combinar com a tipografia.
Todos são decorativos: quem os usa fornece o rótulo acessível.
{% endcomment %}
<svg class="{{ css_class }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
  {% if name == "search" %}
    <circle cx="11" cy="11" r="7" /><path d="m20 20-3.2-3.2" />
  {% elif name == "heart" %}
    <path d="M12 20s-7-4.4-7-9.2A3.8 3.8 0 0 1 12 8a3.8 3.8 0 0 1 7 2.8C19 15.6 12 20 12 20Z" />
  {% elif name == "user" %}
    <circle cx="12" cy="8.5" r="3.5" /><path d="M5 19.5a7 7 0 0 1 14 0" />
  {% elif name == "cart" %}
    <path d="M4 5h2l1.6 9.2a2 2 0 0 0 2 1.6h6.8a2 2 0 0 0 2-1.6L20 8H7" />
    <circle cx="10" cy="19" r="1.3" /><circle cx="17" cy="19" r="1.3" />
  {% elif name == "globe" %}
    <circle cx="12" cy="12" r="8" /><path d="M4 12h16M12 4c2.2 2.3 3.2 5 3.2 8s-1 5.7-3.2 8c-2.2-2.3-3.2-5-3.2-8s1-5.7 3.2-8Z" />
  {% elif name == "chevron-down" %}
    <path d="m6 9 6 6 6-6" />
  {% elif name == "chevron-left" %}
    <path d="m14 6-6 6 6 6" />
  {% elif name == "chevron-right" %}
    <path d="m10 6 6 6-6 6" />
  {% elif name == "arrow-right" %}
    <path d="M5 12h14m-6-6 6 6-6 6" />
  {% elif name == "menu" %}
    <path d="M4 7h16M4 12h16M4 17h16" />
  {% elif name == "close" %}
    <path d="m6 6 12 12M18 6 6 18" />
  {% elif name == "cube" %}
    <path d="M12 3.5 20 8v8l-8 4.5L4 16V8l8-4.5Z" /><path d="m4 8 8 4.5L20 8M12 12.5V20.5" />
  {% elif name == "sparkles" %}
    <path d="M12 4.5 13.4 9l4.5 1.4-4.5 1.4L12 16.3l-1.4-4.5L6.1 10.4 10.6 9 12 4.5Z" /><path d="M18.5 15.5l.7 2.1 2.1.7-2.1.7-.7 2.1-.7-2.1-2.1-.7 2.1-.7.7-2.1Z" />
  {% elif name == "truck" %}
    <path d="M3 7h10v9H3zM13 10h4l3 3v3h-7" /><circle cx="7" cy="18" r="1.5" /><circle cx="17" cy="18" r="1.5" />
  {% elif name == "shield" %}
    <path d="M12 3.5 19 6v5.5c0 4-2.9 7.4-7 8.5-4.1-1.1-7-4.5-7-8.5V6l7-2.5Z" /><path d="m9.2 12 2 2 3.6-3.8" />
  {% elif name == "check" %}
    <path d="m5 12.5 4.5 4.5L19 7.5" />
  {% elif name == "logout" %}
    <path d="M15 5h3.5A1.5 1.5 0 0 1 20 6.5v11a1.5 1.5 0 0 1-1.5 1.5H15" /><path d="M11 8 7 12l4 4M7 12h10" />
  {% elif name == "mail" %}
    <rect x="3.5" y="5.5" width="17" height="13" rx="2" /><path d="m4 7 8 6 8-6" />
  {% elif name == "palette" %}
    <path d="M12 4a8 8 0 1 0 0 16c1.1 0 1.7-.8 1.7-1.6 0-.9-.8-1.4-.8-2.2 0-.8.6-1.4 1.5-1.4H16a4 4 0 0 0 4-4c0-3.7-3.6-6.8-8-6.8Z" />
    <circle cx="8.5" cy="11" r="1" /><circle cx="12" cy="8.5" r="1" /><circle cx="15.5" cy="11" r="1" />
  {% elif name == "map-pin" %}
    <path d="M12 21s6.5-5.6 6.5-10.3a6.5 6.5 0 0 0-13 0C5.5 15.4 12 21 12 21Z" /><circle cx="12" cy="10.5" r="2.4" />
  {% elif name == "credit-card" %}
    <rect x="3" y="5.5" width="18" height="13" rx="2.5" /><path d="M3 10h18M6.5 14.5h3" />
  {% elif name == "package" %}
    <path d="M12 3.5 20 7.5v9L12 20.5 4 16.5v-9l8-4Z" /><path d="m4 7.5 8 4 8-4M12 11.5v9M8 5.5l8 4" />
  {% elif name == "clock" %}
    <circle cx="12" cy="12" r="8" /><path d="M12 7.5V12l3 1.8" />
  {% elif name == "receipt" %}
    <path d="M6 3.5h12v17l-2-1.4-2 1.4-2-1.4-2 1.4-2-1.4-2 1.4Z" /><path d="M9 8.5h6M9 12.5h6" />
  {% elif name == "plus" %}
    <path d="M12 5v14M5 12h14" />
  {% elif name == "pencil" %}
    <path d="M4 20h4L19.5 8.5a2 2 0 0 0-2.8-2.8L4.5 17.5V20Z" /><path d="m15.5 7 2.8 2.8" />
  {% elif name == "trash" %}
    <path d="M4.5 7h15M9.5 7V5.5a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1V7" /><path d="M6.5 7l.8 12a1.5 1.5 0 0 0 1.5 1.4h6.4a1.5 1.5 0 0 0 1.5-1.4L17.5 7" />
  {% elif name == "alert" %}
    <path d="M12 4.5 21 20H3l9-15.5Z" /><path d="M12 10v4.2M12 17.2v.1" />
  {% endif %}
</svg>
